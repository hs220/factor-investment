# Dagster instance config. Run/event/schedule storage in the 'dagster' Postgres
# database (separate DB on the same Timescale instance). Password and host come
# from the environment so no secrets live in this file.
storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      username: factor
      password:
        env: POSTGRES_PASSWORD
      db_name: dagster
      port: 5433

telemetry:
  enabled: false

run_queue:
  max_concurrent_runs: 2

# Reap orphaned runs: if a run's worker process dies (e.g. the container is
# recreated mid-run during a deploy), mark the run FAILED instead of leaving it
# STARTED forever. Without this a killed run hangs indefinitely in the UI.
run_monitoring:
  enabled: true
  start_timeout_seconds: 300   # a run stuck in STARTING this long -> failed
  poll_interval_seconds: 60
