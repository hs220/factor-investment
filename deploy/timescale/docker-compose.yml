# TimescaleDB (Postgres) warehouse — the silver source of truth.
# Runs as a persistent service on the NAS. The pipeline image and the laptop
# both connect over the LAN at <nas-ip>:5432.
#
#   POSTGRES_PASSWORD comes from deploy/timescale/.env (gitignored).
#   Schema auto-applies on first init from schema.sql.
#
# Bring up on the NAS:  ./deploy/deploy_timescale.sh

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: factor-timescale
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factor}
      POSTGRES_USER: ${POSTGRES_USER:-factor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/timescale/.env}
    ports:
      # Host 5433 (5432 is taken by another Postgres on the NAS) -> container 5432.
      # Exposed on the LAN for laptop access. Restrict at the router/firewall if needed.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - ${PGDATA_DIR:-/volume1/factor-data/pgdata}:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # Also on `agent-share`, so home-agent's `factor` connector can reach it as
    # factor-db:5432 without going through the LAN port. It logs in as
    # home_agent_reader (scripts/create_reader.sh), which can only SELECT; the
    # `factor` superuser is never handed to the other project.
    networks:
      default:
      agent-share:
        aliases: [factor-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factor} -d ${POSTGRES_DB:-factor}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # The network home-agent's connector joins; its Compose fragment declares it
  # `external`. This project owns it -- the fixed name is what lets the other
  # stack find it -- so it exists whenever this stack is up, and home-agent
  # leaves its connector out of a deploy when it does not. Only the database joins.
  agent-share:
    name: factor-share
