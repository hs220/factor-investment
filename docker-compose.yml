# Synology Container Manager / QNAP Container Station project.
#
# This image runs the DATA jobs on the NAS (fetch -> write parquet). Heavy
# modeling (train/backtest) runs on the workstation reading the same parquet
# over NFS — NAS CPUs are weak, so we don't model here.
#
# Edit the host volume path below to your NAS shared folder, then:
#   docker compose run --rm build-dataset    # full backfill (slow, run once)
#   docker compose run --rm incremental      # scheduled cheap update
#
# On Synology: create a Project in Container Manager pointing at this file.

x-common: &common
  build: .
  environment:
    - FACTOR_DATA_ROOT=/data
  volumes:
    # Host path to your NAS shared folder; override with FACTOR_HOST_DATA.
    - ${FACTOR_HOST_DATA:-/volume1/factor-data}:/data
  restart: "no"

services:
  build-dataset:
    <<: *common
    command: ["pipelines.build_dataset"]

  incremental:
    <<: *common
    command: ["pipelines.build_dataset", "--incremental"]
