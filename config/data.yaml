# Data layer configuration

universe:
  # Broad US-listed common stocks from the official NASDAQ Trader symbol
  # directory; liquidity filters trim this to the investable ~2-3k names
  # (functionally the Russell 3000 investable core, incl. small caps).
  # The iShares IWV holdings CSV was dropped — that endpoint now serves an
  # HTML landing page to programmatic requests and is no longer reliable.
  source: us_listed
  nasdaq_listed_url: "https://www.nasdaqtrader.com/dynamic/symdir/nasdaqlisted.txt"
  other_listed_url: "https://www.nasdaqtrader.com/dynamic/symdir/otherlisted.txt"
  liquidity_filters:
    min_price: 5.0             # USD; drop sub-$5 (penny/illiquid)
    min_dollar_volume: 1_000_000   # USD; 60-day avg daily $ volume floor
    common_stock_only: true    # drop ETFs, test issues, warrants/units/preferred

prices:
  start_date: "2000-01-01"
  frequency: "monthly"         # resample daily -> month-end
  chunk_size: 50               # tickers per yfinance batch download
  chunk_sleep: 1.0             # seconds between chunks (avoid rate limits)
  max_retries: 3               # retry rounds for failed tickers
  backoff_base: 5.0            # seconds; exponential backoff between retry rounds

fundamentals:
  # Source: SEC EDGAR XBRL companyfacts API (the upstream source of truth).
  # Full filing history with real `filed` dates -> true point-in-time.
  source: sec_edgar
  cik_map_url: "https://www.sec.gov/files/company_tickers.json"
  companyfacts_url: "https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json"
  submissions_url: "https://data.sec.gov/submissions/CIK{cik}.json"
  # SEC requires a descriptive User-Agent with contact info.
  user_agent: "factor-investment research shine.shenghao@gmail.com"
  request_sleep: 0.12          # seconds between SEC calls (rate-limit < 10/s)
  cache_file: "fundamentals_quarterly.parquet"
  refresh: false               # true forces re-fetch of the slow path

factors:
  ff5_momentum: true           # Ken French FF5 + momentum
  macro_series:                # FRED series ids
    yield_curve: ["GS10", "GS2"]   # 10y - 2y
    hy_spread: "BAMLH0A0HYM2"
  vix_ticker: "^VIX"           # via yfinance

cache:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
