# Feature panel configuration

panel:
  frequency: "monthly"
  target_horizon: 1            # months forward
  target: "forward_return_rank"   # within-sector cross-sectional rank
  sector_field: "gics_sector"  # neutralization grouping
  # Plausibility band for a monthly simple return. Outside it the return is a
  # price error (mostly yfinance split re-adjustment seams), not a trade: it is
  # masked before features/target are built. See src/factors/panel.clean_returns.
  return_bounds: [-0.95, 3.0]

normalization:
  method: "cross_sectional"    # rank/z-score within each date
  scheme: "rank"               # rank | zscore
  sector_neutral: true         # demean/rank within sector
  winsorize_pct: 0.01          # clip tails before z-scoring

# Feature list consumed by src/factors/panel.py. Names match the columns the
# panel builder computes. Expected IC sign noted where it aids interpretation
# (the ML model is sign-agnostic; the single-signal analysis in stage 3 uses it).
features:
  # Price / technical (full history, monthly cadence)
  price:
    - momentum_12_2            # return t-12..t-2 (skip last month); + expected
    - momentum_6_1             # return t-6..t-1; + expected
    - volatility_12m           # trailing 12m return stdev; - expected (low-vol)
    - size_log_mktcap          # log market cap (SMB); - expected (size premium)

  # Fundamental (quarterly cadence, forward-filled, PIT)
  fundamental:
    value:
      - earnings_yield         # net_income_ttm / mktcap; + expected
      - book_to_price          # equity / mktcap; + expected
      - ev_ebitda_inv          # ebitda_ttm / EV; + expected
    quality:
      - roe                    # + expected
      - gross_margin           # + expected
      - profit_margin          # + expected
      - accruals               # - expected (low accruals = quality earnings)
    growth:
      - revenue_growth_yoy     # +/- (growth vs value tension)
      - asset_growth_yoy       # - expected (CMA: conservative investment wins)

  # Macro regime (same value broadcast across all stocks at date t)
  macro:
    - yield_curve
    - vix
    - credit_spread

# Daily multi-horizon panel (timing models) — src/factors/panel_daily.py.
# Prototype (notebook 06); see plans/roadmap.md "Next Phase".
panel_daily:
  start_date: "2015-01-01"     # prices_daily history depth (backfill scope)
  horizons: [5, 10, 30]        # forward horizons in TRADING days -> target_{h}d
  # Plausibility band for a DAILY simple return; outside it the print is a
  # price error and is masked (same rationale as panel.return_bounds).
  return_bounds: [-0.9, 2.0]
  features:
    - rev_1d                   # last day's return (short-term reversal)
    - rev_5d                   # last week's return (weekly reversal)
    - rev_21d                  # last month's return (monthly reversal)
    - mom_252_21               # 12-1 momentum on daily data
    - vol_21d                  # 1m realized vol
    - vol_63d                  # 3m realized vol
    - volume_surge             # 20d avg volume / 60d avg volume
    - amihud_21d               # mean |r| / dollar volume (illiquidity)
    - range_21d                # mean (high - low) / close
    - dist_52w_high            # close / 252d max close
    - size_log_mktcap          # log(close * shares), shares PIT from filings
    - book_to_price            # equity / mktcap (PIT)
    - earnings_yield           # net_income_ttm / mktcap (PIT)
    - roe                      # PIT
